zh_CN:
  site_settings:
    school_engine_enabled: "启用学制引擎（年级计算、班级圈、毕业标记、小升初）"
    school_engine_teacher_group: "教师组名（班级圈中教师只读权限）"
    school_engine_graduate_group: "毕业生组名（历史班级圈只读权限）"
    school_engine_class_admin_group: "班级管理组名（该组成员可使用校园管理 API，留空则仅管理员）"
    school_engine_category_rules: "分类匿名规则列表，每行一条『分类slug:模式』；插件不会创建板块，请先自建板块再按 slug 绑定。模式：forced 强制匿名 / optional 回帖可选匿名（精选/胶囊作用于此）/ disabled 禁止。清空则全部关闭；班级圈板块恒不匿名"
    school_engine_feature_enabled: "启用每日精选功能"
    school_engine_capsule_enabled: "启用时光胶囊功能（精选/点赞自动封存与学期报告）"
    school_engine_mood_enabled: "启用每日心情签到与热力图"
    school_engine_tags_enabled: "启用表达空间固定标签种子（碎碎念等 5 个）"
    school_engine_featured_per_day: "每日精选上限（自然日，默认 3 条）"
    school_engine_capsule_like_threshold: "进入时光胶囊的点赞数阈值（默认 10 赞）"
    school_engine_semester_end_1: "第一学期末月-日（如 1-31 表示 1 月 31 日）"
    school_engine_semester_end_2: "第二学期末月-日（如 7-31 表示 7 月 31 日）"
  school_engine:
    feature_already: "这条回帖已经精选过了"
    feature_not_eligible: "只有可选匿名分类的回帖可以被精选"
    feature_quota: "今天的精选名额已用完"
    feature_disabled: "精选功能当前已关闭"
    mood_disabled: "心情签到功能当前已关闭"
    err_mood_invalid: "心情取值无效，请选择 1-5"
    pm:
      featured_title: "你的回答被精选了"
      featured_body: |-
        你那条关于“%{topic_title}”的回答被精选了，写得真好。

        %{url}
      semester_title: "%{semester}时光胶囊"
      semester_body: |-
        这个学期你有 %{count} 条回答被时光收藏，其中 %{featured_count} 条被精选。
        把这个学期的你，封存在这里：

        %{list}
      graduation_title: "毕业时光胶囊"
      graduation_body: |-
        毕业快乐。这里是你在校期间留下的 %{count} 条时光收藏，其中 %{featured_count} 条曾被精选。
        愿这些真实的表达陪你走向下一段旅程。

        %{list}
