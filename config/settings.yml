school_engine:
  school_engine_enabled:
    default: true
    client: true
  school_engine_teacher_group:
    default: "teachers"
  school_engine_graduate_group:
    default: "graduates"
  # 细分管理授权：该组成员可使用校园管理 API（与 staff 等效，不需要 admin 后台权限）
  school_engine_class_admin_group:
    default: ""
  # 分类匿名规则（每行一条：分类slug:模式）。插件不创建任何板块，
  # 由管理员自建板块后在此绑定；清空即全部关闭（班级圈板块恒不匿名）。
  # 模式：forced 强制（OP+回帖全匿名）/ optional 可选（仅回帖可选匿名）/ disabled 禁止
  # 下面只是与默认板块模板对应的预设值，板块不存在时无任何效果，可任意修改或删除：
  #   confess:optional、anonymous-wall:forced
  # 注意：精选功能不依赖该规则，任意板块的回帖都可被 staff 精选（班级圈板块仅强制不匿名）
  school_engine_category_rules:
    default: "confess:optional|anonymous-wall:forced"
    type: list
    list_type: simple
    client: true
  # ---- 功能开关 ----
  school_engine_feature_enabled:
    default: true
    client: true
  school_engine_capsule_enabled:
    default: true
    client: true
  school_engine_mood_enabled:
    default: true
    client: true
  school_engine_tags_enabled:
    default: true
    client: true
  # ---- 数值 / 日期参数 ----
  # 每日精选上限（自然日）
  school_engine_featured_per_day:
    default: 3
    min: 1
  # 首页精选区块展示的话题数量（每个话题最多 3 条精选）
  school_engine_featured_topics:
    default: 1
    min: 1
    max: 6
  # 进入时光胶囊的点赞数阈值
  school_engine_capsule_like_threshold:
    default: 10
    min: 1
  # 学期末月-日（两学期，scheduled job 匹配当天生成胶囊报告）
  school_engine_semester_end_1:
    default: "1-31"
  school_engine_semester_end_2:
    default: "7-31"
  # ---- 审核 / 举报 ----
  school_engine_moderation_enabled:
    default: true
    client: true
  # 复核组成员（除 staff 外可处理举报队列；避嫌规则对非管理员生效）
  school_engine_moderation_group:
    default: "moderators"
  # 举报人保护：前台不显示举报人身份，后台留痕
  school_engine_report_anonymous_note:
    default: true
  # AI 自动关键词审核开关（异步队列，不影响发帖）
  school_engine_ai_review_enabled:
    default: true
  # 追加敏感词（每行一个，仅服务端可见；接口永不返回词条）
  school_engine_ai_keywords:
    default: ""
    type: string
    secret: true
  # 违规联系方式的处置强度：hint（提示）/ fold（折叠）/ hide（待复核）
  school_engine_contact_leak_action:
    default: "fold"
    type: enum
    choices:
      - hint
      - fold
      - hide
  # ---- 审计日志 ----
  school_engine_audit_enabled:
    default: true
  # 单个审计日志文件上限（MB），超过后自动轮转并 gzip 压缩
  school_engine_audit_max_mb:
    default: 20
    min: 1
    max: 200
  # 归档日志保留天数，超期自动删除
  school_engine_audit_keep_days:
    default: 90
    min: 1
    max: 365
  # ---- 界面定制（全部可在后台开关，无需改代码）----
  school_engine_ui_enabled:
    default: true
    client: true
  # 隐藏 Discourse 原生举报按钮，统一使用插件的分类举报入口
  school_engine_hide_native_flag:
    default: true
    client: true
  # 侧边栏：把「校园」分区移到最上方
  school_engine_sidebar_school_first:
    default: true
    client: true
  # 侧边栏：隐藏的分区（逗号分隔，可选 tags / messages / categories / school）
  school_engine_sidebar_hidden_sections:
    default: "tags,messages"
    type: list
    list_type: simple
    client: true
  # 隐藏页脚 Powered by Discourse
  school_engine_hide_powered_by:
    default: true
    client: true
  # 编辑器工具栏按钮顺序（逗号分隔的按钮类名；留空则使用 Discourse 默认顺序）
  school_engine_composer_button_order:
    default: "upload,emoji,blockquote,list,bold,italic,code,link,heading"
    type: list
    list_type: simple
    client: true
  # 移动端隐藏的编辑器按钮
  school_engine_composer_mobile_hidden:
    default: "link,heading,gifs"
    type: list
    list_type: simple
    client: true
  # 是否启用简洁/高级编辑器切换滑块
  school_engine_composer_mode_switch:
    default: true
    client: true
  # 插件页面内容区最大宽度（px）
  school_engine_page_max_width:
    default: 860
    min: 600
    max: 1400
    client: true
