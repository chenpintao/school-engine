en:
  site_settings:
    school_engine_enabled: "Enable the school engine (grade calculation, class circles, graduation, junior-high transition)"
    school_engine_teacher_group: "Teacher group name (faculty identity group; no access to student class circles by default — manually add a teacher to a class group when needed)"
    school_engine_graduate_group: "Graduate group name (alumni identity group; graduates only keep access to their own class circle, never other classes)"
    school_engine_class_admin_group: "Class admin group name; members can use the school management APIs (empty = staff only)"
    school_engine_category_rules: "Category anonymity rules, one 'slug:mode' per line; categories are never auto-created — bind your own category slugs here. Mode: forced / optional (reply-only optional anonymity) / disabled. Empty disables anonymity everywhere; class-circle categories are always non-anonymous. Featuring is not category-gated: replies in any category can be featured"
    school_engine_feature_enabled: "Enable daily featured posts"
    school_engine_capsule_enabled: "Enable the time capsule (auto-archive from featured/likes and semester reports)"
    school_engine_mood_enabled: "Enable daily mood check-ins and heatmap"
    school_engine_tags_enabled: "Enable expression-space default tags (5 tags)"
    school_engine_featured_per_day: "Maximum featured posts per calendar day (default 3)"
    school_engine_featured_topics: "Number of topics shown in the home featured block (1-6, default 1; up to 3 featured items each)"
    school_engine_capsule_like_threshold: "Like count threshold for the time capsule (default 10)"
    school_engine_semester_end_1: "First semester end month-day (e.g. 1-31 means Jan 31)"
    school_engine_semester_end_2: "Second semester end month-day (e.g. 7-31 means Jul 31)"
  school_engine:
    register_paused: "New signups are currently paused. Please use an invitation link from a teacher, or check back later."
    invite_email_mismatch: "This invitation is tied to a specific email address — please sign up with the invited email"
    feature_already: "This post has already been featured"
    feature_not_eligible: "Only posts in regular topics can be featured"
    feature_quota: "Today's feature quota has been used up"
    feature_disabled: "The featured-posts feature is currently disabled"
    mood_disabled: "The mood check-in feature is currently disabled"
    err_mood_invalid: "Invalid mood, please choose 1-5"
    pm:
      featured_title: "Your post was featured"
      featured_body: |-
        Your post about "%{topic_title}" was featured. Nicely written.

        %{url}
      semester_title: "%{semester} Time Capsule"
      semester_body: |-
        This semester, %{count} of your replies were archived in the time capsule, including %{featured_count} featured replies.
        Here is this semester's you, safely kept:

        %{list}
      graduation_title: "Graduation Time Capsule"
      graduation_body: |-
        Happy graduation. Here are %{count} archived moments from your school years, including %{featured_count} that were featured.
        May these honest voices travel with you.

        %{list}
